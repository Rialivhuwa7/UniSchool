# Local PostgreSQL for trying the staging setup on your own machine.
#   docker compose up -d
# then run the app with these environment variables:
#   SPRING_PROFILES_ACTIVE=staging
#   DB_URL=jdbc:postgresql://localhost:5432/unischool
#   DB_USERNAME=unischool
#   DB_PASSWORD=unischool
#   UNISCHOOL_JWT_SECRET=local-staging-secret-0123456789abcdefgh
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unischool
      POSTGRES_USER: unischool
      POSTGRES_PASSWORD: unischool
    ports:
      - "5432:5432"
    volumes:
      - unischool-pg:/var/lib/postgresql/data
volumes:
  unischool-pg:
